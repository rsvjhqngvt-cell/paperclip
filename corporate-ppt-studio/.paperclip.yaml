schema: paperclip/v1

agents:
  ceo:
    adapter:
      type: claude_local
      config:
        model: claude-opus-4-7
    inputs:
      env:
        ANTHROPIC_API_KEY:
          kind: secret
          requirement: required

  template-analyst-claude:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
    inputs:
      env:
        ANTHROPIC_API_KEY:
          kind: secret
          requirement: required

  template-analyst-codex:
    adapter:
      type: codex_local
    inputs:
      env:
        OPENAI_API_KEY:
          kind: secret
          requirement: required

  content-architect-claude:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
    inputs:
      env:
        ANTHROPIC_API_KEY:
          kind: secret
          requirement: required

  content-architect-codex:
    adapter:
      type: codex_local
    inputs:
      env:
        OPENAI_API_KEY:
          kind: secret
          requirement: required

  deck-builder-claude:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
    inputs:
      env:
        ANTHROPIC_API_KEY:
          kind: secret
          requirement: required

  deck-builder-codex:
    adapter:
      type: codex_local
    inputs:
      env:
        OPENAI_API_KEY:
          kind: secret
          requirement: required

  qa-reviewer-claude:
    adapter:
      type: claude_local
      config:
        model: claude-sonnet-4-6
    inputs:
      env:
        ANTHROPIC_API_KEY:
          kind: secret
          requirement: required

  qa-reviewer-codex:
    adapter:
      type: codex_local
    inputs:
      env:
        OPENAI_API_KEY:
          kind: secret
          requirement: required

routines:
  template-library-health-check:
    triggers:
      - kind: schedule
        cronExpression: "0 9 * * 1"
        timezone: Asia/Seoul
